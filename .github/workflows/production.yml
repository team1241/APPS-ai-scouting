name: Production readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  reference-tests:
    name: Reference and schedule regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scouting_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scouting_test
      NEXT_TELEMETRY_DISABLED: "1"
      CLERK_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npx --yes pnpm@12.3.4 install --frozen-lockfile
      - name: Check code
        run: |
          npx --yes pnpm@12.3.4 check
          npx --yes pnpm@12.3.4 typecheck
          npx --yes pnpm@12.3.4 --filter @ai-scouting/web build
      - name: Migrate disposable test database
        run: |
          touch apps/backend/.env
          npx --yes pnpm@12.3.4 db:migrate
          npx --yes pnpm@12.3.4 db:types:check
      - name: Run all tests
        run: npx --yes pnpm@12.3.4 test

      - name: Simulate event and verify full database restore
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scouting_gh10_event
          RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scouting_gh10_event_restore
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          sudo bash scripts/install-postgres-client.sh
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          createdb scouting_gh10_event
          createdb scouting_gh10_event_restore
          npx --yes pnpm@12.3.4 db:migrate
          node apps/backend/src/reliability-simulation.ts "$RUNNER_TEMP/event-simulation.json"
          node apps/mastra/src/recovery-drill.ts seed
          node scripts/restore-drill.mjs "$RUNNER_TEMP/restore-drill.json"
          DATABASE_URL="$RESTORE_DATABASE_URL" node apps/mastra/src/recovery-drill.ts verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-drill
          path: |
            ${{ runner.temp }}/event-simulation.json
            ${{ runner.temp }}/restore-drill.json
          if-no-files-found: ignore

  migrate:
    if: github.event_name != 'pull_request'
    needs: reference-tests
    name: Validate and migrate production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npx --yes pnpm@12.3.4 install --frozen-lockfile
      - name: Apply production migrations and verify generated types
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing production migration secret"; exit 1; }
          touch apps/backend/.env
          npx --yes pnpm@12.3.4 db:migrate
          npx --yes pnpm@12.3.4 db:types:check
